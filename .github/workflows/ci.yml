name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --ignore E501,F841,E701,B007,UP031,UP042

      - name: Test
        run: python test_bot.py

      - name: No-network smoke test
        run: |
          docker build -t yeno-bot .
          docker run --network=none yeno-bot python -c "import bot; print('imports cleanly with no network')"
