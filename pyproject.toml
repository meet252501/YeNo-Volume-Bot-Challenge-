[project]
name = "yeno-volume-bot"
version = "0.1.0"
description = "Volume-generating trading agent for the Builderr.ai YeNo challenge"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
